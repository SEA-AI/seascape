name: Image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          push: true
          build-args: SEASCAPE_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/sea-ai/seascape:latest
            ghcr.io/sea-ai/seascape:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
