name: Image

on:
  # Only a commit that passed CI is published.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  # One queue for manual and automatic runs: none slips between another's tip
  # check and its push.
  group: ${{ github.workflow }}
  # Every commit keeps its :<sha> tag: none running is cancelled, none pending dropped.
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish:
    name: Publish
    # A fork's pull request from its own `main` also reports head_branch main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is main's tip only: a manual run from a branch, or a CI run that
      # finished after a newer commit's, publishes just its SHA.
      - id: tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tags="ghcr.io/sea-ai/seascape:$SHA"
          if [ "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" = "$SHA" ]; then
            tags="$tags,ghcr.io/sea-ai/seascape:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: ${{ github.server_url }}/${{ github.repository }}.git#${{ env.SHA }}
          push: true
          build-args: SEASCAPE_COMMIT=${{ github.sha }}
          tags: ${{ steps.tags.outputs.tags }}
          # In the registry: the Actions cache is shared with CI's and holds 10 GB.
          cache-from: type=registry,ref=ghcr.io/sea-ai/seascape:buildcache
          cache-to: type=registry,ref=ghcr.io/sea-ai/seascape:buildcache,mode=max
