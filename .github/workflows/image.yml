name: Image

on:
  # Only a commit that passed CI is published.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every commit keeps its :<sha> tag.
  cancel-in-progress: false

permissions:
  contents: read

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish:
    name: Publish
    # A fork's pull request from its own `main` also reports head_branch main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ github.server_url }}/${{ github.repository }}.git#${{ env.SHA }}
          push: true
          tags: |
            ghcr.io/sea-ai/seascape:latest
            ghcr.io/sea-ai/seascape:${{ env.SHA }}
          # In the registry: the Actions cache is shared with CI's and holds 10 GB.
          cache-from: type=registry,ref=ghcr.io/sea-ai/seascape:buildcache
          cache-to: type=registry,ref=ghcr.io/sea-ai/seascape:buildcache,mode=max
