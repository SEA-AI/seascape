name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Full version because setup-uv publishes no major tag past v7; dependabot
      # moves it. Every other action here floats on its major.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - run: uv sync --locked

      # fetch downloads again any cached asset that misses its sha256.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/seascape
          key: assets-${{ hashFiles('seascape/assets.toml') }}

      - run: uvx ruff check .
      - run: uvx ruff format --check .
      - run: uvx tombi format --check
      - run: uvx ty check
      - run: uv run pytest
