name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # No check reads an image or the files that only Codecov, pre-commit or the image
  # build read. Lint formats the code in every Markdown file, skills included; the
  # tests read the docs' Markdown but not the agents' skills.
  changes:
    name: Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            lint:
              - '**'
              - '!**/*.jpg'
              - '!**/*.png'
              - '!codecov.yml'
              - '!.pre-commit-config.yaml'
              - '!Dockerfile'
              - '!.dockerignore'
              - '!compose*.yaml'
              - '!.github/workflows/image.yml'
            tests:
              - '**'
              - '!**/*.jpg'
              - '!**/*.png'
              - '!codecov.yml'
              - '!.pre-commit-config.yaml'
              - '!Dockerfile'
              - '!.dockerignore'
              - '!compose*.yaml'
              - '!.github/workflows/image.yml'
              - '!.claude/**'

  lint:
    name: Lint
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.lint == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Full version because setup-uv publishes no major tag past v7; dependabot
      # moves it. Every other action here floats on its major.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - run: uv sync --locked
      - run: uvx ruff check .
      - run: uvx ruff format --check .
      - run: uvx tombi format --check
      - run: uvx ty check
      - run: uvx --from import-linter lint-imports

  tests:
    name: Tests (${{ matrix.shard }})
    # A lint failure is cheaper to fix first than a test run is to wait for.
    needs: [changes, lint]
    if: ${{ !failure() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.tests == 'true') }}
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports its failures, not only the first to fail.
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - run: uv sync --locked

      # Workbench, which `seascape zones` renders with, needs OpenGL; the runner has no
      # GPU, and Mesa's llvmpipe draws it in software.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri

      # fetch downloads again any cached asset that misses its sha256.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/seascape
          key: assets-${{ hashFiles('seascape/assets/assets.toml') }}

      - run: uv run pytest --shard ${{ matrix.shard }} --durations=20 --cov=seascape
        env:
          COVERAGE_FILE: .coverage.${{ strategy.job-index }}

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ strategy.job-index }}
          path: .coverage.${{ strategy.job-index }}
          include-hidden-files: true

  coverage:
    name: Coverage
    needs: tests
    # A skipped `changes`, as on a push, would skip this job under the default `if`.
    if: ${{ !cancelled() && needs.tests.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true

      - uses: astral-sh/setup-uv@v10.3.3

      - run: uvx coverage combine && uvx coverage xml

      - uses: codecov/codecov-action@v7
        # A fork's run gets no OIDC token, and the action fails asking for one.
        continue-on-error: true
        with:
          use_oidc: true

  # Codecov's statuses are required, so a commit whose tests were skipped still
  # reports to Codecov, which then passes them.
  no-coverage:
    name: Coverage (no tests)
    needs: tests
    if: ${{ !cancelled() && needs.tests.result == 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          run_command: empty-upload
          # The paths filter already decided no tested file changed.
          force: true
          use_oidc: true

  # The one check of this workflow a pull request requires, whatever the jobs above
  # are called.
  checks:
    name: Checks
    if: always()
    needs: [changes, lint, tests]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
