name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Whether a pull request touches anything but images, which nothing checks.
  changes:
    name: Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.jpg'
              - '!**/*.png'

  lint:
    name: Lint
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Full version because setup-uv publishes no major tag past v7; dependabot
      # moves it. Every other action here floats on its major.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - run: uv sync --locked
      - run: uvx ruff check .
      - run: uvx ruff format --check .
      - run: uvx tombi format --check
      - run: uvx ty check
      - run: uvx --from import-linter lint-imports

  tests:
    name: Tests (${{ matrix.shard }})
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports its failures, not only the first to fail.
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - run: uv sync --locked

      # Workbench, which `seascape zones` renders with, needs OpenGL; the runner has no
      # GPU, and Mesa's llvmpipe draws it in software.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri

      # fetch downloads again any cached asset that misses its sha256.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/seascape
          key: assets-${{ hashFiles('seascape/assets/assets.toml') }}

      - run: uv run pytest --shard ${{ matrix.shard }} --durations=20

  # The one check a pull request requires, whatever the jobs above are called.
  checks:
    name: Checks
    if: always()
    needs: [changes, lint, tests]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
