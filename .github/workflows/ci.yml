name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Full version because setup-uv publishes no major tag past v7; dependabot
      # moves it. Every other action here floats on its major.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - run: uv sync --locked
      - run: uvx ruff check .
      - run: uvx ruff format --check .
      - run: uvx tombi format --check
      - run: uvx ty check

  tests:
    name: Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports its failures, not only the first to fail.
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - run: uv sync --locked

      # fetch downloads again any cached asset that misses its sha256.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/seascape
          key: assets-${{ hashFiles('seascape/assets.toml') }}

      - run: uv run pytest --shard ${{ matrix.shard }} --durations=20

  # The one check a pull request requires, whatever the jobs above are called.
  checks:
    name: Checks
    if: always()
    needs: [lint, tests]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
