services:
  seascape:
    image: ghcr.io/sea-ai/seascape:latest
    ports: ["${SEASCAPE_PORT:-8765}:8765"]
    # Unset, each keeps the default in seascape/server.py.
    environment:
      - SEASCAPE_MAX_DURATION_S
      - SEASCAPE_MAX_PIXELS
      - SEASCAPE_MAX_IMAGES
      - SEASCAPE_MIN_FREE_GB
      - SEASCAPE_MCP_SECRET
    volumes:
      - cache:/root/.cache/seascape
      - ${SEASCAPE_RENDERS:-./renders}:/root/.cache/seascape/renders
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # Only with `--profile ngrok`: a public HTTPS URL that dials out, so no inbound port.
  ngrok:
    image: ngrok/ngrok:latest
    profiles: [ngrok]
    command: [http, "seascape:8765", --url, "${NGROK_URL:-}"]
    environment:
      - NGROK_AUTHTOKEN
    restart: unless-stopped

volumes:
  cache:
