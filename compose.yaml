services:
  seascape:
    image: ghcr.io/sea-ai/seascape:latest
    ports: ["${SEASCAPE_PORT:-8765}:8765"]
    # Unset or empty, each keeps its default.
    environment:
      - SEASCAPE_ALLOWED_HOSTS
      - SEASCAPE_PUBLIC_URL=${NGROK_URL:-}
      - SEASCAPE_MAX_DURATION_S
      - SEASCAPE_MAX_PIXELS
      - SEASCAPE_MAX_IMAGES
      - SEASCAPE_MIN_FREE_GB
      - SEASCAPE_MAX_RUN_S
      - SEASCAPE_MAX_QUEUED
      - SEASCAPE_MAX_VARIANTS
      - SEASCAPE_MAX_SAMPLES
      - SEASCAPE_MCP_SECRET
    volumes:
      - cache:/root/.cache/seascape
      - ${SEASCAPE_RENDERS:-./renders}:/root/.cache/seascape/renders
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  ngrok:
    image: ngrok/ngrok:3
    profiles: [ngrok]
    depends_on: [seascape]
    # Compose reads a required variable for every service, selected or not, so the
    # check is here: plain `docker compose up` never starts this service.
    entrypoint:
      - sh
      - -c
      - >-
        test -n "$$NGROK_URL" || { echo "NGROK_URL is required"; exit 1; };
        exec ngrok http seascape:8765 --url "$$NGROK_URL"
        --traffic-policy-file /policy.yaml
    environment:
      - NGROK_AUTHTOKEN
      - NGROK_URL
    configs:
      - source: ngrok-policy
        target: /policy.yaml
    restart: unless-stopped

configs:
  # Anthropic's outbound ranges: https://platform.claude.com/docs/en/api/ip-addresses
  # Only the MCP path: a person opens the render links from their own address.
  ngrok-policy:
    content: |
      on_http_request:
        - expressions:
            - req.url.path.startsWith('/mcp')
          actions:
            - type: restrict-ips
              config:
                enforce: true
                allow: [160.79.104.0/21, 153.61.208.0/20]

volumes:
  cache:
