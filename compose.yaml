services:
  seascape:
    build: .
    ports: ["8765:8765"]
    environment: [SEASCAPE_ALLOWED_HOSTS]
    volumes:
      - cache:/root/.cache/seascape
      - ${SEASCAPE_RENDERS:-./renders}:/root/.cache/seascape/renders
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

volumes:
  cache:
