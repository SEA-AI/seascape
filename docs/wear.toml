#:schema ../schema/scenario.json

extends = "../scenarios/open-sea.toml"

[rigs.bow]
pitch_deg = -1.5

[rigs.bow.cameras.eo]
hfov_deg = 22.0
width_px = 960
height_px = 540

[rigs.bow.cameras.ir]
hfov_deg = 22.0
width_px = 640
height_px = 360

[sky]
# Low and to the side, so the hull side faces it.
sun_bearing_deg = 300.0
sun_elevation_deg = 35.0

[outputs.samples]
eo = 64
ir = 64
