[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seascape"
version = "0.1.0"
description = "Maritime scene generator for sensor validation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# bpy ships 3.13-only wheels, and the lock must resolve on every version claimed.
requires-python = "==3.13.*"
authors = [{ name = "Kevin Serrano" }]
keywords = ["blender", "maritime", "synthetic-data", "lwir", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "click>=8.2",
    "numpy>=2.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic>=2.9",
]

[project.scripts]
seascape = "seascape.cli:main"

[project.urls]
Homepage = "https://github.com/kevinconka/seascape"
Repository = "https://github.com/kevinconka/seascape"
Issues = "https://github.com/kevinconka/seascape/issues"

[dependency-groups]
dev = ["pytest>=9.0"]
blender = ["bpy>=5.2"]

[tool.uv]
default-groups = ["dev", "blender"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["render: needs Cycles, run with --render"]
