[project]
name = "seascape"
version = "0.1.0"
description = "Maritime scene generator for sensor validation."
readme = "README.md"
# bpy ships 3.13-only wheels, and the lock must resolve on every version claimed.
requires-python = "==3.13.*"
license = "Apache-2.0 AND CC-BY-4.0"
license-files = ["LICENSE", "NOTICE", "seascape/physics/data/CC-BY-4.0.txt"]
authors = [{ name = "Kevin Serrano" }]
keywords = ["blender", "computer-vision", "lwir", "maritime", "synthetic-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "click>=8.2",
    "numpy>=2.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic>=2.9",
]

[project.urls]
Homepage = "https://github.com/SEA-AI/seascape"
Issues = "https://github.com/SEA-AI/seascape/issues"
Repository = "https://github.com/SEA-AI/seascape"

[project.scripts]
seascape = "seascape.cli:main"

[dependency-groups]
dev = ["pytest>=9.0", "pytest-xdist>=3.8"]
blender = ["bpy>=5.2"]
serve = [
    "mcp>=2.3",
    "pydantic-settings>=2.16",
    "starlette>=1.8",
    "uvicorn>=0.54",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.importlinter]
root_package = "seascape"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Each layer imports only those below it"
type = "layers"
containers = ["seascape"]
layers = [
    "cli",
    "server | catalog | zones",
    "render",
    "blender",
    "outputs",
    "config",
    "assets",
    "physics | model",
]

[[tool.importlinter.contracts]]
name = "Only Blender code imports Blender"
type = "protected"
protected_modules = ["bpy", "mathutils"]
allowed_importers = ["seascape.blender", "seascape.render", "seascape.cli", "seascape.zones"]

[tool.pytest.ini_options]
# Renders share one GPU: past four workers the suite runs no faster.
addopts = "-n 4 --dist worksteal"
markers = ["render: renders a frame in Cycles; -m \"not render\" leaves it out"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev", "blender", "serve"]
