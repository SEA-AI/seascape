target-version = "py313"
line-length = 88

[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
    "C90",  # mccabe
    "PL",  # pylint
    "TID",  # flake8-tidy-imports
]
ignore = [
    "PLR2004",  # a literal sits beside the source it cites
]

[lint.per-file-ignores]
# Imported where used, so `schema` and a failed validation skip loading bpy.
"seascape/cli.py" = ["PLC0415"]

[lint.pylint]
max-args = 8

[lint.flake8-tidy-imports.banned-api]
"sys.path".msg = "Import by package, not by editing the import path."
"site.addsitedir".msg = "Import by package, not by editing the import path."
"importlib.reload".msg = "Build fresh instead of reloading modules."
"importlib.util.spec_from_file_location".msg = "Import by package, not by file."
"importlib.machinery.SourceFileLoader".msg = "Import by package, not by file."
"importlib.import_module".msg = "Import by package, with an import statement."
"importlib.util.module_from_spec".msg = "Import by package, not by file."
"sys.meta_path".msg = "Import by package, not by editing the import machinery."
"sys.path_hooks".msg = "Import by package, not by editing the import machinery."

[format]
docstring-code-format = true
