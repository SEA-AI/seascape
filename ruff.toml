target-version = "py313"
line-length = 88

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
    "C90", # mccabe
    "PL",  # pylint
    "TID", # flake8-tidy-imports
]
ignore = [
    "PLR2004", # a literal sits beside the source it cites
]

[lint.per-file-ignores]
"seascape/{blend,render,scene,sea,video}.py" = ["TID253"]
"tests/**" = ["TID253"]
"docs/{assets,skies}.py" = ["TID253"]

[lint.flake8-tidy-imports]
# Imported where used, so `schema` and a failed validation skip loading bpy.
banned-module-level-imports = [
    "bpy",
    "seascape.blend",
    "seascape.render",
    "seascape.scene",
    "seascape.sea",
    "seascape.video",
]

[lint.pylint]
max-args = 8

[format]
docstring-code-format = true
