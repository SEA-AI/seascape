[environment]
# bpy, bpy_extras and mathutils are compiled and ship no stubs. typings/ makes only
# them Any, so every rule still checks the code around them.
extra-paths = ["typings"]
python-version = "3.13"

[src]
include = ["seascape", "tests", "docs"]

# matplotlib draws the docs' charts and is run with `uv run --with`, not installed.
[[overrides]]
include = ["docs/primer/charts.py"]

[overrides.rules]
unresolved-import = "ignore"
