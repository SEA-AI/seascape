repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  # Local rather than astral-sh/ruff-pre-commit, whose `rev` would be a second
  # ruff version drifting against the uvx one that CI runs.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uvx ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uvx ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true
      - id: tombi-format
        name: tombi format
        entry: uvx tombi format
        language: system
        types: [toml]
        require_serial: true
      - id: lint-imports
        name: lint-imports
        entry: uvx --from import-linter lint-imports
        language: system
        types_or: [python, toml]
        pass_filenames: false
