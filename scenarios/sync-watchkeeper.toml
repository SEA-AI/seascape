#:schema ../schema/scenario.json

extends = "sync.toml"

# Watchkeeper rides on small motorboats.
[ownship]
asset = "zodiac"

# On the radar arch, whose top is 1.78 m up, 2.6 m aft.
[rigs.mast]
preset = "watchkeeper"
height_m = 1.9
offset_y_m = -2.6

# One on each thermal camera's boresight, broadside; the wide colour camera sees both.
[[objects]]
asset = "container"
range_m = 26.0
bearing_deg = -12.5
heading_deg = 90.0
heading_from = "line_of_sight"

[[objects]]
asset = "container"
range_m = 26.0
bearing_deg = 12.5
heading_deg = 90.0
heading_from = "line_of_sight"
