#:schema ../schema/scenario.json

# Tests measure against these numbers: extend it in a variant rather than edit it.

seed = 20260920

[rigs.bow]
height_m = 12.0

[rigs.bow.cameras.eo]
band = "eo"
hfov_deg = 45.0
width_px = 1920
height_px = 1080

[rigs.bow.cameras.ir]
band = "ir"
hfov_deg = 24.0
width_px = 640
height_px = 512

[sky]
# Keeps the sun disc out of frame.
sun_bearing_deg = 135.0

[[objects]]
preset = "multipurpose_freighter"
range_m = 2000.0
# Inside both frames.
bearing_deg = 8.0
heading_deg = 250.0
