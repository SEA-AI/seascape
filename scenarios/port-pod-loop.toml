#:schema ../schema/scenario.json

extends = "twin-pod.toml"

[rig]
pods = [{ preset = "port" }]

[sky]
hdri = "kloofendal_48d_partly_cloudy"

[outputs]
duration_s = 40.0
fps = 9
loop = true

# A list replaces the one it extends.
[[objects]]
asset = "cargo_ship"
range_m = 3704.0
bearing_deg = -10.0
heading_deg = 80.0

[[objects]]
asset = "small_container_ship"
range_m = 7408.0
bearing_deg = -50.0
heading_deg = 300.0

[[objects]]
asset = "patrol_vessel"
range_m = 1200.0
bearing_deg = -85.0
heading_deg = 150.0

[[objects]]
asset = "yacht"
range_m = 200.0
bearing_deg = -90.0
orbit = { period_s = 80.0, count = 2 }

[[objects]]
asset = "lateral_mark"
range_m = 600.0
bearing_deg = -70.0

[[objects]]
asset = "container"
range_m = 350.0
bearing_deg = -30.0
heading_deg = 40.0
