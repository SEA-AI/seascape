#:schema ../schema/scenario.json

seed = 20260920

[rig]
preset = "twin_pod"

[sky]
# Keeps the sun disc out of frame.
sun_bearing_deg = 135.0

[ownship]
asset = "container_ship"
roll_deg = 2.0
pitch_deg = 0.5

# Roll period: IMO 2008 IS Code weather criterion, T = 2 C B / sqrt(GM), for a 200 m
# hull of about 32 m beam and GM 1-1.5 m. Amplitudes are a judgement for this sea state.
[ownship.roll]
amplitude_deg = 1.0
period_s = 20.0

[ownship.pitch]
amplitude_deg = 0.3
period_s = 8.0

[ownship.heave]
amplitude_m = 0.2
period_s = 8.0

[targets]
asset = "container_ship"
range_m = 12964.0
# Enough that every camera sees one.
count = 8
bearing_deg = [-120.0, 120.0]

[[objects]]
preset = "container_ship"
range_m = 3704.0
bearing_deg = -10.0
heading_deg = 80.0  # beam-on, so it presents its length

[[objects]]
preset = "container_ship"
range_m = 7408.0
bearing_deg = 10.0
heading_deg = 280.0
