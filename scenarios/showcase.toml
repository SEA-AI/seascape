#:schema ../schema/scenario.json

# The server's `render` default: the baseline's rig and freighter at sunset, close
# enough to read its wear, lit from behind the camera, through the camera a
# Watchkeeper ships.
extends = "baseline.toml"

[sky]
hdri = "table_mountain_2"
# Behind the rig, so the low sun lights the hull. In frame it backlights it.
sun_bearing_deg = 160.0
# Judgement: a clear day, well above the Met Office's "good" at sea (over 5 nautical
# miles). Without it the air holds no aerosol.
visibility_km = 25.0

[rigs.bow.cameras.eo]
# Its sensor's noise and eHDR, as the Pod rig takes them. A preset replaces the
# baseline's camera block, so the field of view and size are restated.
preset = "basler_daa3840_ar0821"
hfov_deg = 45.0
width_px = 1920
height_px = 1080
processing = { white_balance = "grey_world" }
sensor = { hdr_ratio = 16.0 }
# The cos^4 falloff of a lens at its field angle.
lens = { vignetting = true }

[[objects]]
preset = "multipurpose_freighter"
range_m = 550.0
# Centred, so the hull is whole in the IR frame.
bearing_deg = 0.0
heading_deg = 250.0
# Judgement: rust, grime and a waterline stain a viewer sees at this range.
wear = 0.8

[outputs.samples]
# Judgement: the default leaves grain on the sea; more samples stop helping past this.
eo = 64
