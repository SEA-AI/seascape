#:schema ../schema/scenario.json

extends = "sync.toml"

# Sentry rides on motor yachts.
[ownship]
asset = "lobster_yacht"

# On the hardtop's roof, whose top is 2.73 m up, 1.6 to 2.1 m aft.
[rigs.mast]
preset = "sentry"
height_m = 2.9
offset_y_m = -1.8
ptu = { inclination_deg = -1.9 }

# 50 deg/s is the Sentry PTU firmware's go-to rate, reached in one step.
[turn]
ptu = "mast"
top_rate_deg_s = 50.0

# Placed by `seascape sync` for this rig and turn.
[[objects]]
asset = "container"
range_m = 128.2
bearing_deg = 0.0
heading_deg = 90.0
heading_from = "line_of_sight"

[[objects]]
asset = "mooring_buoy"
range_m = 41.0
bearing_deg = -61.6
count = 19
spacing_deg = 6.6
colour = "orange"
wear = 0.5
heading_deg = 90.0
heading_from = "line_of_sight"
drift = { sway_m = 0.5, surge_m = 0.25, period_s = { uniform = [45.0, 75.0] } }

