#:schema ../schema/scenario.json

# Frames for a detector.
extends = "randomized.toml"

[rigs.bow]
height_m = { uniform = [5.0, 60.0] }
yaw_deg = 0.0

# Both bands through one lens, so both frame the same hulls. The Boson's focal plane
# and noise, at this field of view.
[[rigs.bow.cameras.choice]]
eo = { preset = "basler_daa3840_ar0821_drawn", hfov_deg = 42.0, width_px = 1920, height_px = 1080 }
ir = { preset = "boson_640_32deg", hfov_deg = 42.0 }

[[rigs.bow.cameras.choice]]
eo = { preset = "basler_daa3840_ar0821_drawn", hfov_deg = 49.0, width_px = 1920, height_px = 1080 }
ir = { preset = "boson_640_32deg", hfov_deg = 49.0 }

# In the inherited options' order: Blender's sky, then a photographed one. The sun
# anywhere, glare included.
[sky]
weights = [1, 9]
sun_bearing_deg = { uniform = [0.0, 360.0] }

[[objects]]
count = { integer = [1, 5] }
asset = { choice = [
    "multipurpose_freighter",
    "cargo_ship",
    "bulk_carrier",
    "ultramax_bulk_carrier",
    "panamax_container_ship",
    "crude_tanker",
    "patrol_vessel",
    "yacht",
    "lobster_yacht",
    "zodiac",
    "irwin_38",
    "cruising_sloop",
    "viking_glory",
    "viking_grace",
    "silja_serenade",
    "mariella",
    "pride_of_kent",
    "meriluoto",
    "usv_magura",
    "usv_stalker",
    "usv_naval_drone",
] }
heading_from = "line_of_sight"
heading_deg = { choice = [0.0, 180.0] }
# Across the wider lens; a hull outside the narrower one is a negative.
bearing_deg = { uniform = [-24.5, 24.5] }
# Nearer, a tall mast looks down past a long hull's near end and cuts its box.
range_m = { uniform = [500.0, 2500.0] }
# Judgement: up to a merchant ship's service speed, 16 kn.
speed_mps = { uniform = [0.0, 8.0] }
# Judgement: three in four run their engines, the rest stopped, from just now to cold.
# Limitation: drawn apart from speed, so a hull under way can draw its engines off.
engine_off_min = { choice = [0.0, { uniform = [0.0, 120.0] }], weights = [3, 1] }
# White to black paint.
paint_absorptance = { uniform = [0.14, 0.97] }
# Judgement: no hull at sea is fresh from the yard; any wear up to neglect.
wear = { uniform = [0.1, 1.0] }
