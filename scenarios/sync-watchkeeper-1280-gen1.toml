#:schema ../schema/scenario.json

extends = "sync.toml"

# Watchkeeper rides on small motorboats.
[ownship]
asset = "zodiac"

# On the radar arch, whose top is 1.78 m up, 2.6 m aft.
[rigs.mast]
preset = "watchkeeper"
height_m = 1.9
offset_y_m = -2.6

[turn]
top_rate_deg_s = 30.0
accel_deg_s2 = 30.0

# Placed by `seascape sync` for this rig and turn.
[[objects]]
asset = "container"
range_m = 18.2
bearing_deg = 0.0
heading_deg = 90.0
heading_from = "line_of_sight"

[[objects]]
asset = "mooring_buoy"
range_m = 29.6
bearing_deg = -57.3
heading_deg = 90.0
heading_from = "line_of_sight"
wear = 0.5
colour = "orange"

