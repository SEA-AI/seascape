#:schema ../schema/scenario.json

extends = "baseline.toml"

[rigs.bow]
height_m = { uniform = [4.0, 25.0] }
pitch_deg = { uniform = [-3.0, 1.0] }
yaw_deg = { uniform = [-8.0, 8.0] }
cameras.eo.hfov_deg = { uniform = [15.0, 70.0] }
cameras.ir.hfov_deg = { uniform = [12.0, 40.0] }
# Boson+ Industrial's 20 mK at f/1.0 (Boson+ datasheet,
# https://flir.netx.net/file/asset/55485/original/attachment/) to Boson Consumer's
# 60 mK behind its slowest 640 lens, f/1.10 at 90 % transmission, scaled from f/1.0
# by (f/#)^2 / tau (Boson datasheet 102-2013-40, sec. 11.1 and table 13).
cameras.ir.microbolometer.netd_k = { uniform = [0.02, 0.081] }
# The presets an operator picks from on a Boson-based FLIR M364C LR.
cameras.ir.agc = { choice = [
    { preset = "day" },
    { preset = "night" },
    { preset = "high_contrast" },
    { preset = "dock" },
] }

[ownship]
roll_deg = { uniform = [-4.0, 4.0] }
pitch_deg = { uniform = [-1.5, 1.5] }

# Blender's sky or a photographed one. The sun sits behind the cameras, out of frame.
[[sky.choice]]
sun_elevation_deg = { uniform = [2.0, 60.0] }
# solar_gain_k's steady state, a E / (h + 4 eps sigma T^3), for a from light paint's
# 0.30 to a dark hull's 0.90 under the same clear sky.
solar_gain_k = { uniform = [8.5, 25.5] }
sun_bearing_deg = { uniform = [100.0, 260.0] }
visibility_km = { uniform = [4.0, 42.0] }
atmosphere = { choice = ["north_sea", "north_sea_winter", "north_sea_summer", "tropical", "subarctic_winter"] }

[[sky.choice]]
hdri = { choice = [
    "aristea_wreck",
    "belfast_sunset",
    "citrus_orchard",
    "citrus_orchard_road",
    "drackenstein_quarry",
    "evening_road_01",
    "farm_field",
    "hilly_terrain_01",
    "industrial_sunset",
    "industrial_sunset_02",
    "kloofendal_28d_misty",
    "kloofendal_38d_partly_cloudy",
    "kloofendal_48d_partly_cloudy",
    "kloofendal_misty_morning",
    "kloofendal_overcast",
    "kloppenheim_01",
    "kloppenheim_03",
    "kloppenheim_05",
    "kloppenheim_06",
    "mud_road",
    "overcast_soil",
    "quarry_04",
    "qwantani_dusk_1",
    "qwantani_dusk_2",
    "rocky_ridge",
    "scythian_tombs",
    "snow_field",
    "snow_field_2",
    "sunflowers",
    "table_mountain_1",
    "table_mountain_2",
    "wasteland_clouds",
] }
sun_bearing_deg = { uniform = [100.0, 260.0] }
visibility_km = { uniform = [4.0, 42.0] }
atmosphere = { choice = ["north_sea", "north_sea_winter", "north_sea_summer", "tropical", "subarctic_winter"] }

[sea]
# Into whitecapping seas. Elfouhaily et al. 1997 fitted 3-21 m/s; below 3 the sea is
# held to Cox & Munk.
wind_speed_mps = { uniform = [1.0, 18.0] }
wind_from_deg = { uniform = [0.0, 360.0] }
# Judgement: a harbour to a storm's reach. Below 2 km an 18 m/s sea passes the youngest
# wave age Elfouhaily et al. 1997 fitted.
fetch_km = { log_uniform = [2.0, 1000.0] }
# Gyre to bloom, inside the 0.02-30 mg/m^3 Morel & Maritorena 2001 rest on.
chlorophyll_mg_m3 = { log_uniform = [0.03, 10.0] }
# Averaging the 8.3% of nearshore sea slicks held off Hawaii (Gove et al., PNAS
# 116(48) 24143, 2019).
slick_cover = { uniform = [0.0, 0.17] }
# Judgement: about Gauss's 0.13; near the surface it swings far wider (Hirt et al.,
# JGR 115 D21102, 2010).
refraction_k = { uniform = [0.05, 0.25] }

[sea.swell]
height_m = { uniform = [0.2, 2.5] }
period_s = { uniform = [6.0, 14.0] }
from_deg = { uniform = [0.0, 360.0] }

[[objects]]
asset = { choice = [
    "multipurpose_freighter",
    "cargo_ship",
    "bulk_carrier",
    "ultramax_bulk_carrier",
    "panamax_container_ship",
    "crude_tanker",
    "patrol_vessel",
    "yacht",
    "lobster_yacht",
    "zodiac",
    "irwin_38",
    "cruising_sloop",
    "viking_glory",
    "viking_grace",
    "silja_serenade",
    "mariella",
    "pride_of_kent",
    "meriluoto",
    "usv_magura",
    "usv_stalker",
    "usv_naval_drone",
    "lateral_mark",
    "pillar_buoy",
] }
range_m = { uniform = [200.0, 2500.0] }
# Not always in a narrow frame: an empty one is a negative.
bearing_deg = { uniform = [-8.0, 8.0] }
heading_deg = { uniform = [0.0, 360.0] }
# Judgement: three in four run their engines, the rest stopped, from just now to cold.
# Limitation: drawn apart from speed, so a hull under way can draw its engines off.
engine_off_min = { choice = [0.0, { uniform = [0.0, 120.0] }], weights = [3, 1] }
# White to black paint.
paint_absorptance = { uniform = [0.14, 0.97] }
# Judgement: one hull in four fresh from the yard, the rest any wear up to neglect.
wear = { choice = [0.0, { uniform = [0.1, 1.0] }], weights = [1, 3] }
