#:schema ../schema/scenario.json

# Shared by `sync-<product>.toml`, which sets the ownship, the rig, what turns and how
# fast, and the objects `seascape sync` places for them.
seed = 20261106

# A stand-in, so this file validates alone.
[rigs.mast]
height_m = 3.0
cameras.eo = { preset = "eo_4k_49deg" }
cameras.ir = { preset = "ir_vga_24deg" }

# With the waves' rocking, gives every IMU axis a signal. Judgement: a hull's yaw
# sway peaking at 0.6 deg/s over 8 s, so 0.6 * 8 / (2 pi) = 0.76 deg.
[ownship]
yaw = { amplitude_deg = 0.76, period_s = 8.0 }

# 6 deg/s is the collision-avoidance sweep rate the Confluence page "Sensors
# Synchronization" assumes. Judgement: reversals at +-60 deg, 3 s holds, and a slew at
# the product's top rate. A stand-in top rate, which each product sets.
[turn]
top_rate_deg_s = 30.0
moves = [
    { to_deg = 0.0, hold_s = 3.0 },
    { to_deg = 60.0, rate_deg_s = 6.0 },
    { to_deg = -60.0, rate_deg_s = 6.0 },
    { to_deg = 0.0, rate_deg_s = 6.0, hold_s = 3.0 },
    { to_deg = 60.0, hold_s = 3.0 },
    { to_deg = 0.0, hold_s = 3.0 },
]

[sea]
wind_speed_mps = 3.5
fetch_km = 20.0
wind_from_deg = 300.0

[sky]
hdri = "industrial_sunset"
sun_bearing_deg = 150.0

[outputs]
fps = 30
duration_s = 60.0
format = "png"
samples = { eo = 8, ir = 8 }
