#:schema ../schema/scenario.json

# Shared by `sync-<product>.toml`, which replaces the rig.
seed = 20261106

# A stand-in, so this file validates alone, on the zodiac's radar arch: its top is
# 1.78 m up and 2.6 m aft.
[rigs.mast]
height_m = 1.9
offset_y_m = -2.6
cameras.eo = { preset = "eo_4k_49deg" }
cameras.ir = { preset = "ir_vga_24deg" }

# Its waves' rocking and a yaw swing give every IMU axis a signal, small enough that
# the narrow cameras keep their containers mid-frame.
[ownship]
asset = "zodiac"
yaw = { amplitude_deg = 0.5, period_s = 10.0 }

[sea]
wind_speed_mps = 3.5
fetch_km = 20.0
wind_from_deg = 300.0

[sky]
hdri = "industrial_sunset"
sun_bearing_deg = 150.0

[outputs]
fps = 30
duration_s = 30.0
format = "png"
samples = { eo = 8, ir = 8 }
