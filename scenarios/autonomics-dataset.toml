#:schema ../schema/scenario.json

# 4K frames, each scene seen through a 42 and a 45 degree lens: only the field of view
# differs. Hulls of interest are ranged by optical depth, so each sits equally deep in
# the haze whatever the visibility; the others by distance.
extends = "randomized.toml"

[rigs.bow]
height_m = { uniform = [5.0, 60.0] }
yaw_deg = 0.0
# Tilted down so the horizon sits under the frame's top edge; the ownship's pitch is
# narrowed to keep it in frame.
pitch_deg = { uniform = [-10.0, -5.0] }

# One option, so the table replaces the inherited cameras. The lens, sensor and
# processing draws are shared by a rig's cameras.
[[rigs.bow.cameras.choice]]
eo42 = { preset = "basler_daa3840_ar0821_drawn", hfov_deg = 42.0, width_px = 3840, height_px = 2160 }
eo45 = { preset = "basler_daa3840_ar0821_drawn", hfov_deg = 45.0, width_px = 3840, height_px = 2160 }

[ownship]
pitch_deg = { uniform = [-0.5, 0.5] }

[outputs]
bands = ["eo"]

# The inherited options' order: Blender's sky, then a photographed one. The sun
# anywhere, glare included.
[sky]
weights = [1, 9]
sun_bearing_deg = { uniform = [0.0, 360.0] }
visibility_km = { triangular = [25.0, 48.0, 48.0] }

[sea]
# Under 2 m/s, a large swell with slicks overflows the sea shader's SVM stack and
# renders it black.
wind_speed_mps = { uniform = [2.0, 14.0] }

# Hulls of interest, heading mostly along the line of sight. Bearings stay inside the
# 42 degree frame.
[[objects]]
count = { integer = [1, 2] }
asset = { choice = ["short_sea_freighter", "coaster"] }
range_m = { optical_depth = [1.0, 1.5] }
bearing_deg = { uniform = [-17.0, 17.0] }
heading_from = "line_of_sight"
# Weight 4 bow on (0) and stern on (180), 1 elsewhere.
# Same odds, any heading rather than 20 degree steps, but a seed draws a new scene:
# heading_deg = { choice = [0.0, 180.0, { uniform = [0.0, 360.0] }], weights = [4, 4, 26] }
heading_deg = { choice = [
    0.0,
    20.0,
    40.0,
    60.0,
    80.0,
    100.0,
    120.0,
    140.0,
    160.0,
    180.0,
    200.0,
    220.0,
    240.0,
    260.0,
    280.0,
    300.0,
    320.0,
    340.0,
], weights = [
    4,
    1,
    1,
    1,
    1,
    1,
    1,
    1,
    1,
    4,
    1,
    1,
    1,
    1,
    1,
    1,
    1,
    1,
] }
speed_mps = { uniform = [0.0, 8.0] }
t_k = { uniform = [257.0, 300.0] }

[[objects]]
count = { integer = [0, 2] }
asset = { choice = [
    "multipurpose_freighter",
    "cargo_ship",
    "bulk_carrier",
    "ultramax_bulk_carrier",
    "panamax_container_ship",
    "crude_tanker",
] }
range_m = { uniform = [3704.0, 18520.0] }
# Across the wider lens; a hull outside the narrower one is a negative.
bearing_deg = { uniform = [-24.5, 24.5] }
heading_from = "line_of_sight"
heading_deg = { uniform = [0.0, 360.0] }
speed_mps = { uniform = [0.0, 8.0] }
t_k = { uniform = [257.0, 300.0] }

[[objects]]
count = { integer = [0, 2] }
asset = { choice = ["lateral_mark", "pillar_buoy", "ocean_buoy"] }
range_m = { uniform = [556.0, 9260.0] }
bearing_deg = { uniform = [-24.5, 24.5] }
t_k = { uniform = [257.0, 300.0] }
