# The Basler dart profile with its settings drawn about it, for a dataset.
extends = "basler_daa3840_ar0821.toml"

[sensor]
# Basler's EMVA Data Overview No. 18 spans these: IMX540 to IMX174.
full_well_e = { uniform = [9700.0, 31800.0] }
dark_noise_e = { uniform = [2.0, 7.0] }
# Judgement: daylight.
gain_db = { uniform = [0.0, 12.0] }
# One exposure, or Basler HDR Beyond's default ratio.
hdr_ratio = { choice = [1.0, 16.0] }

[lens]
vignetting = { choice = [true, false] }

# Judgements.
[processing]
white_balance_k = { uniform = [-1500.0, 1500.0] }
sharpen = { uniform = [0.0, 1.0] }
exposure_ev = { uniform = [-1.0, 1.0] }
