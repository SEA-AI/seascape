# The bulk_carrier's port bridge wing. 2 m above the wing deck keeps the deck plate out
# of every lower frame edge.
extends = "pod.toml"

height_m = 19.7
yaw_deg = -60.0
offset_x_m = -14.5
offset_y_m = -61.5

# Inboard, square to the side window, as the prototype assembly ("Anschütz Milestone
# 1", Onshape) mounts it; the Anschütz POD Product Requirements Specification v1.0,
# 3.2, says 48.5.
cameras.ir.yaw_deg = 47.5
