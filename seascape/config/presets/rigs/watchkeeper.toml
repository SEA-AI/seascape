# The design geometry: two thermal cameras toed out by 11.4 deg, one colour camera
# between them. The calibrated tilts of a unit (up to 0.5 deg) and the lens offsets
# are left out.
model = "Watchkeeper"

[cameras.eo]
preset = "basler_daa3840_ar0821"
# Fitted to the mean image radius of two calibrated units' fisheye models, which differ
# by up to 33 px at the image's side.
hfov_deg = 132.93
lens = { fisheye = [-0.0793, -0.0461, 0.0331, -0.0065] }

[cameras.ir_l]
preset = "boson_640_24deg"
yaw_deg = -11.4

[cameras.ir_r]
preset = "boson_640_24deg"
yaw_deg = 11.4
