# Teledyne FLIR Boson 640 with its 32 deg lens.
# https://www.oem.flir.com/products/boson/
band = "ir"
hfov_deg = 32.0
width_px = 640
height_px = 512

[microbolometer]
# Professional grade, <= 50 mK at f/1.0 against 30 C (Boson datasheet 102-2013-40,
# table 15): an upper bound.
netd_k = 0.05
pitch_um = 12.0
# The 20640A032 lens (Boson datasheet 102-2013-40, table 13).
f_number = 1.0
