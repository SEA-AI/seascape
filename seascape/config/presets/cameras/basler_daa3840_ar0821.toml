# Basler dart daA3840-30mc, onsemi AR0821 colour sensor and its image processing.
# The block that mounts it supplies hfov_deg.
# https://docs.baslerweb.com/daa3840-30mc
band = "eo"
width_px = 3840
height_px = 2160

[sensor]
# EMVA 1288: shot noise caps the SNR at sqrt(full well), and the AR0821 datasheet
# (Rev. 7) gives SNRmax 41 dB, so 10^(41/10).
full_well_e = 12600.0
# Neither onsemi nor Basler publishes it. A proxy: Basler's IMX676, the nearest pixel
# (2.0 um to the AR0821's 2.1 um), EMVA Data Overview No. 18.
dark_noise_e = 4.0
# AR0821 datasheet: linear mode, 12-bit.
adc_bits = 12
width_px = 3840
# AR0821 datasheet.
pitch_um = 2.1
# The AR0821's eHDR (datasheet) at Basler HDR Beyond's default ratio.
hdr_ratio = 16.0

[processing]
# Basler's AutoTargetBrightness, a mean before gamma (Exposure Auto (dart E)); its
# default, read with gst-inspect-1.0 pylonsrc off a Watchkeeper's daA3840-30mci.
exposure_target = 0.22
# The camera balances white continuously, as it ships.
white_balance = "grey_world"
