# Jenoptik EVIDIR alpha 640: the camera only. The block that mounts it supplies
# hfov_deg and microbolometer.f_number.
# https://www.jenoptik.com/products/cameras-and-imaging-modules/thermographic-camera/thermal-imaging-camera
band = "ir"
width_px = 640
height_px = 480

[microbolometer]
# <= 20 mK, conditions not given (EVIDIR alpha GigE datasheet, 02/2026).
netd_k = 0.02
# Same datasheet.
pitch_um = 12.0
